# WSL Men's Championship Tour — 2023 season specification
#
# Inherits Era A shared rules from ./era_a.yaml (same directory).
# Only season-specific facts and overrides appear below.
#
# RULES FOR THIS FILE
#   - Every fact carries a `source`. A fact with `source: null` is NOT verified.
#   - Never write a plausible value. Write `null` and a `todo`.

season: 2023
tour: mens_championship_tour
inherits: era_a
spec_status: draft          # draft | signed_off
last_updated: 2026-07-25

sources:
  calendar:
    url: https://www.worldsurfleague.com/events/2023/ct?all=1
    captured: 2026-07-25
  final_rankings:
    url: https://www.worldsurfleague.com/athletes/tour/mct?year=2023
    captured: 2026-07-25
  rulebook:
    file: docs/format-spec/rulebooks/2023_WSL_Rule_Book.pdf

world_champion:
  surfer: Filipe Toledo
  country: Brazil
  source: https://www.worldsurfleague.com/athletes/tour/mct?year=2023
  note: >
    Recorded explicitly, never derived from points. Rank 1 on the published
    final rankings, which reallocate the top five by WSL Finals placing under
    Rule 1.05(e). The points leader is frequently NOT the champion.

cut:
  exists: true
  after_event: 5
  source: null
  todo: >
    Inferred from the calendar position of the Margaret River Pro and confirmed
    consistent with the throwaway validation across the full field. NOT yet
    confirmed from a published WSL announcement. Confirm before sign-off.

throwaway:
  eligible_event_numbers: [1..5]
  note: >
    5 pre-cut events, so Rule 1.09(c)'s seven-event condition is NOT
    met. The season-total throwaway is nonetheless applied in the published
    rankings — see ../THROWAWAY_DERIVATION.md.

