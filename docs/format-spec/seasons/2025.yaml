# WSL Men's Championship Tour — 2025 season specification
#
# Inherits Era A shared rules from ./era_a.yaml (same directory).
# Only season-specific facts and overrides appear below.
#
# RULES FOR THIS FILE
#   - Every fact carries a `source`. A fact with `source: null` is NOT verified.
#   - Never write a plausible value. Write `null` and a `todo`.

season: 2025
tour: mens_championship_tour
inherits: era_a
spec_status: draft          # draft | signed_off
last_updated: 2026-07-25

sources:
  calendar:
    url: https://www.worldsurfleague.com/events/2025/ct?all=1
    captured: 2026-07-25
  final_rankings:
    url: https://www.worldsurfleague.com/athletes/tour/mct?year=2025
    captured: 2026-07-25
  rulebook:
    file: docs/format-spec/rulebooks/2025_WSL_Rule_Book_clean_06012025.pdf
    last_updated: 2025-06-01

world_champion:
  surfer: Yago Dora
  country: Brazil
  source: https://www.worldsurfleague.com/athletes/tour/mct?year=2025
  note: >
    Recorded explicitly, never derived from points. Rank 1 on the published
    final rankings, which reallocate the top five by WSL Finals placing under
    Rule 1.05(e). The points leader is frequently NOT the champion.

cut:
  exists: true
  after_event: 7
  source: null
  todo: >
    Inferred from the calendar position of the Margaret River Pro and confirmed
    consistent with the throwaway validation across the full field. NOT yet
    confirmed from a published WSL announcement. Confirm before sign-off.

throwaway:
  eligible_event_numbers: [1..7]
  note: >
    7 pre-cut events, so Rule 1.09(c)'s seven-event condition IS met
    for the mid-season cut calculation. The season-total throwaway applies
    regardless — see ../THROWAWAY_DERIVATION.md.

